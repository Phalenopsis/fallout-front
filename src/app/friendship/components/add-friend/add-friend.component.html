<div class="pipboy-box">
  <div class="pipboy-header">
    <span class="symbol">></span> TRANSMISSION RADIO - RECHERCHE D'AMI
  </div>

  <form (ngSubmit)="onSubmit()" class="pipboy-form">
    <label for="friend-username" class="pipboy-label"> INDICATEUR D'IDENTITÉ : </label>

    <div class="input-group">
      <input
        id="friend-username"
        type="text"
        class="pipboy-input"
        [ngModel]="username()"
        (ngModelChange)="username.set($event)"
        name="username"
        placeholder="Entrez le pseudo..."
        autocomplete="off"
        [disabled]="isLoading()"
      />
      <button type="submit" class="btn" [disabled]="isLoading() || !username().trim()">
        {{ isLoading() ? 'TRANSMISSION...' : 'ENVOYER DEMANDE' }}
      </button>
    </div>
  </form>

  <!-- Zones de notifications CRT -->
  @if (successMessage()) {
    <div class="pipboy-status status-success">
      <span class="status-icon">[ OK ]</span> {{ successMessage() }}
    </div>
  }

  @if (errorMessage()) {
    <div class="pipboy-status status-error">
      <span class="status-icon">[ ERREUR ]</span> {{ errorMessage() }}
    </div>
  }
</div>
