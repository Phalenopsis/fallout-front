<div class="wrapper">
  <section>
    <div>Points restant à répartir : {{ characterCreationService.remainingSpecialPoint() }}</div>

    @for (stat of stats; track $index) {
      <article (click)="setActive(stat.key)" [class.active]="activeStat === stat.key">
        <div class="statistic">{{ stat.label }}</div>

        <button (click)="remove(stat.key)" [disabled]="special[stat.key] <= specialFloor">-</button>

        <div class="value">{{ special[stat.key] }}</div>

        <button
          (click)="add(stat.key)"
          [disabled]="
            characterCreationService.remainingSpecialPoint() <= 0 ||
            special[stat.key] >= maxStats[stat.key]
          "
        >
          +
        </button>
      </article>
    }
  </section>

  <section class="description">
    @for (line of activeDescription; track $index) {
      <p>
        {{ line }}
      </p>
    }

    @if (activeImage; as image) {
      <app-image [image]="image"></app-image>
    }
  </section>
</div>
<button class="btn" (click)="previousStep()">Précédent</button>
<button
  class="btn"
  [disabled]="characterCreationService.remainingSpecialPoint() > 0"
  (click)="saveAndNextStep()"
>
  Sauver la création
</button>
<button
  class="btn"
  [disabled]="characterCreationService.remainingSpecialPoint() > 0"
  (click)="nextStep()"
>
  Suivant
</button>
