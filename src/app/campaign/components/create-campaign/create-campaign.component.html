<div class="pipboy-box">
  <div class="pipboy-header"><span class="symbol">></span> PROTOCOLE - NOUVELLE CAMPAGNE (MJ)</div>

  <form (ngSubmit)="onSubmit()" class="pipboy-form">
    <label for="campaign-name" class="pipboy-label"> DÉSIGNATION DU SECTEUR / CAMPAGNE : </label>

    <div class="input-group">
      <input
        id="campaign-name"
        type="text"
        class="pipboy-input"
        [ngModel]="campaignName()"
        (ngModelChange)="campaignName.set($event)"
        name="campaignName"
        placeholder="Nom de la campagne..."
        autocomplete="off"
        [disabled]="isLoading()"
      />
      <button type="submit" class="btn" [disabled]="isLoading() || !campaignName().trim()">
        {{ isLoading() ? 'CREATION...' : 'INITIALISER' }}
      </button>
    </div>
  </form>

  @if (successMessage()) {
    <div class="pipboy-status status-success">
      <span class="status-icon">[ OK ]</span> {{ successMessage() }}
    </div>
  }

  @if (errorMessage()) {
    <div class="pipboy-status status-error">
      <span class="status-icon">[ ERREUR ]</span> {{ errorMessage() }}
    </div>
  }
</div>
